# 🤖 マルチエージェント連携 設定ファイル案 (agent.yaml)

本ファイルは、明日以降の「マルチウィンドウ連携（ホスト・ワーカー分散リサーチ）」を円滑にするためのアイデアスケッチです。

---

## 💡 通信設計：ID共有ファイルによるディスカバリー

全エージェントがアクセス可能なワークスペース上の共通ディレクトリ（例：`xpermssion/`）を通信バッファとして利用します。

### 1. ホスト（統括側エージェント）の役割
起動時、自身の `Conversation ID` をファイルに書き込みます。
*   書き込み先: `xpermssion/active_parent_id.txt`

### 2. ワーカー（検索側エージェント）の役割
起動時、上記の共有ファイルを読みに行きます。
*   取得したIDに向けて `send_message` を送り、「私（ワーカー）は起動しました。指示をください」と通知します。

---

## 📋 エージェント役割定義（パネルでの分類イメージ）

*   **Role: Permission_Host (リサーチ統括)**
    *   **責務**: 調査対象リスト（CSV）の管理、ワーカーへのタスク割り振り、結果の集約レポート作成。
*   **Role: Permission_Worker_Zoekt (検索専門)**
    *   **責務**: ホストから指定されたパーミッションに対して Zoekt を実行（親エージェントとして実行すればサンドボックス制限を回避可能！）、ソースコードの出現箇所をホストに通知。

明日、この構成を画面上で複数立ち上げて検証をスタートしましょう！
